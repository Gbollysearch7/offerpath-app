<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; min-height: 72px; background: #FFFFFF; border-bottom: 1px solid #E6EDE8; font-family: 'Geist', system-ui, sans-serif; color: #000000;">
<div style="max-width: 1440px; margin: 0 auto; padding: 12px 28px; box-sizing: border-box; min-height: 72px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 28px;">
<a href="App_Dashboard.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #000000; font-weight: 500; font-size: 18px; letter-spacing: -0.02em;">
<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="14" fill="#DCE6DF"></circle><path d="M8 17l4-4 3 3 5-6" fill="none" stroke="#36604E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Offerpath</a>
<nav aria-label="App" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto;">
<sc-for list="{{items}}" as="i" hint-placeholder-count="6">
<a href="{{i.href}}" aria-current="{{i.cur}}" style="{{i.style}}">{{i.label}}</a>
</sc-for>
</nav>
<a href="App_Upload.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 18px; border-radius: 999px; background: #000000; color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500;">
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2v2.5H5" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Re-score CV</a>
<button aria-label="Account" style="width: 42px; height: 42px; border-radius: 50%; border: 0; background: #F2F4F1; color: #36604E; font-family: inherit; font-weight: 500; font-size: 14px;">JR</button>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","review","tailor","letters","opportunities","templates"],"default":"review"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'review';
    const list = [
      ['dashboard', 'Dashboard', 'App_Dashboard.dc.html'],
      ['review', 'CV review', 'App_Overview.dc.html'],
      ['tailor', 'Tailor to a job', 'App_Tailor.dc.html'],
      ['letters', 'Cover letters', 'App_CoverLetter.dc.html'],
      ['opportunities', 'Opportunities', 'App_Opportunities.dc.html'],
      ['templates', 'Templates', 'App_Templates.dc.html']
    ];
    return {
      items: list.map(([id, label, href]) => ({
        label, href, cur: id === a ? 'page' : 'false',
        style: 'text-decoration: none; font-size: 14px; padding: 10px 14px; border-radius: 999px; ' + (id === a ? 'background: #F2F4F1; color: #000000; font-weight: 500;' : 'color: #45524D;')
      }))
    };
  }
}
</script>
</body>
</html>
