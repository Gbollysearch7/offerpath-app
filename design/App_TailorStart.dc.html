<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tailor: add a job ad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F4F1}
a{color:#36604E}a:hover{color:#264A3B}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="min-height: 1000px; background: #F2F4F1; color: #000000; font-family: 'Geist', system-ui, sans-serif;">
<dc-import name="App_Topbar" active="tailor" hint-size="100%,72px"></dc-import>
<main style="max-width: 1120px; margin: 0 auto; padding: 48px 28px 64px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
<div style="flex: 1 1 100%;">
<h1 style="margin: 0; font-size: 44px; font-weight: 400; letter-spacing: -1.98px; line-height: 1.1;">Tailor your CV to a job</h1>
<p style="margin: 10px 0 0; font-size: 16px; color: #45524D;">See which keywords you're missing, your match before and after, and a tailored version side by side.</p>
</div>
<section aria-labelledby="f-h" style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 18px;">
<h2 id="f-h" style="margin: 0; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.04em; color: #5C6B66;">1 · CHOOSE A CV</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500;"><span style="position: absolute; left: -9999px;">CV</span>
<select style="min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #DCE3DE; background: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400;"><option>Jordan_Reed_CV_v6.pdf · score 68</option><option>Jordan_Reed_CV_v5.pdf · score 61</option></select></label>
<h2 style="margin: 10px 0 0; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.04em; color: #5C6B66;">2 · ADD THE JOB AD</h2>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500;">Link to the job ad
<input type="url" placeholder="https://careers.example.co.uk/graduate-analyst" style="min-height: 50px; padding: 0 14px; border-radius: 14px; border: 1px solid #DCE3DE; font: inherit; font-size: 15px; font-weight: 400;"></label>
<div style="display: flex; align-items: center; gap: 12px; font-size: 13px; color: #5C6B66;"><span style="flex: 1; height: 1px; background: #EEF2EF;"></span>or paste the text<span style="flex: 1; height: 1px; background: #EEF2EF;"></span></div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500;"><span style="position: absolute; left: -9999px;">Job ad text</span>
<textarea rows="8" placeholder="Paste the role description, responsibilities and requirements. Leave out salary and company background." style="padding: 14px; border-radius: 14px; border: 1px solid #DCE3DE; font: inherit; font-size: 15px; font-weight: 400; line-height: 1.55; resize: vertical;"></textarea></label>
<a href="App_Tailor.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 999px; background: #000000; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 500;">Compare my CV</a>
</section>
<aside aria-labelledby="t-h" style="flex: 1 1 320px; min-width: 0; background: #FFFFFF; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
<h2 id="t-h" style="margin: 0 0 4px; font-family: 'Geist Mono', monospace; font-size: 12px; font-weight: 400; letter-spacing: 0.04em; color: #5C6B66;">OR PICK A TRACKED ROLE</h2>
<sc-for list="{{roles}}" as="r" hint-placeholder-count="3">
<a href="App_Tailor.dc.html" style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; background: #F2F4F1; text-decoration: none; color: #000000;">
<span style="font-size: 15px;">{{r.t}}</span><span style="font-size: 13px; color: #45524D;">{{r.d}}</span>
</a>
</sc-for>
<a href="App_Opportunities.dc.html" style="font-size: 14px; margin-top: 4px;">Browse opportunities</a>
</aside>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { roles: [{ t: 'Analyst Graduate Scheme · Northbank', d: 'Closes 14 Nov · already tailored' }, { t: 'Consulting Summer Internship · Ashby & Co', d: 'Closes 22 Nov' }, { t: 'Spring Week · Harlow Partners', d: 'Closes 3 Dec' }] };
  }
}
</script>
</body>
</html>
