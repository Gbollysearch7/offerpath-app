<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Score breakdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F2F4F1}
a{color:#36604E}a:hover{color:#264A3B}
</style>
</helmet>
<div style="min-height: 1300px; background: #F2F4F1; color: #000000; font-family: 'Geist', system-ui, sans-serif;">
<dc-import name="App_Topbar" active="review" hint-size="100%,72px"></dc-import>
<div style="max-width: 1440px; margin: 0 auto; padding: 24px 28px 56px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;">
<div style="flex: 1 1 260px; max-width: 280px;"><dc-import name="App_Sidebar" active="breakdown" hint-size="280px,1180px"></dc-import></div>
<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 20px;">
<div style="padding: 8px 4px 4px;">
<h1 style="margin: 0; font-size: 44px; font-weight: 400; letter-spacing: -1.98px; line-height: 1.1;">Score breakdown</h1>
<p style="margin: 8px 0 0; font-size: 15px; color: #45524D;">How your 68 is made up. Each area is out of 100, each check out of 10.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 20px;">
<sc-for list="{{areas}}" as="a" hint-placeholder-count="6">
<section style="flex: 1 1 380px; min-width: 0; background: #FFFFFF; border-radius: 24px; padding: 22px 24px; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px;">
<h2 style="margin: 0; font-size: 22px; font-weight: 400; letter-spacing: -0.04em;">{{a.name}}</h2>
<p style="margin: 0; font-size: 30px; letter-spacing: -0.05em;">{{a.score}}</p>
</div>
<div style="height: 6px; border-radius: 99px; background: #EEF2EF;"><div style="width: {{a.w}}; height: 6px; border-radius: 99px; background: {{a.c}};"></div></div>
<p style="margin: 0; font-size: 14px; line-height: 1.5; color: #45524D;">{{a.what}}</p>
<div style="display: flex; flex-direction: column;">
<sc-for list="{{a.checks}}" as="k" hint-placeholder-count="3">
<a href="App_Check.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #EEF2EF; text-decoration: none; color: #000000;">
<span style="{{k.badge}}">{{k.s}}</span>
<span style="flex: 1 1 auto; min-width: 0;"><span style="display: block; font-size: 15px;">{{k.t}}</span><span style="display: block; font-size: 13px; color: #5C6B66; margin-top: 2px;">{{k.d}}</span></span>
<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 3l4 4-4 4" fill="none" stroke="#5C6B66" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const badge = (s) => 'min-width: 34px; height: 26px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-family: Geist Mono, monospace; font-size: 12px; ' + (s >= 8 ? 'background: #DCE6DF; color: #36604E;' : s >= 5 ? 'background: #F2F4F1; color: #1F2A27;' : 'background: #000000; color: #FFFFFF;');
    const A = [
      ['Impact', 58, 'Do your bullets show results, not just duties?', [['Quantifying impact', 2, '3 of 16 bullets have a number'], ['Action verbs', 4, '5 weak verbs like "helped"'], ['Accomplishments', 10, 'No duty-style phrases'], ['Repetition', 10, 'Varied wording']]],
      ['Clarity', 72, 'Is every line easy to read in one pass?', [['Filler words', 9, '1 filler word'], ['Buzzwords and clichés', 5, '2 buzzwords in your summary'], ['Passive voice', 10, 'All active']]],
      ['Structure and ATS', 80, 'Can people and screening software find what matters?', [['Sections', 5, 'References line can go'], ['ATS readability', 9, 'Simple layout, readable text'], ['Contact details', 10, 'Email, phone and LinkedIn found']]],
      ['Sector relevance', 61, 'Does it speak the language of finance and banking?', [['Sector keywords', 6, '4 common keywords missing']]],
      ['Spelling and grammar', 92, 'UK English, consistent and correct.', [['Spelling', 8, '1 US spelling: "organize"'], ['Grammar', 10, 'No issues']]],
      ['Length and formatting', 74, 'Right length, consistent bullets.', [['Length', 10, '2 pages'], ['Bullet length', 8, '3 bullets under 10 words'], ['Bullet count', 10, '16 bullets in core sections']]]
    ];
    return {
      areas: A.map(([name, score, what, checks]) => ({ name, score, what, w: score + '%', c: score >= 75 ? '#36604E' : '#8FB3A1',
        checks: checks.map(([t, s, d]) => ({ t, s, d, badge: badge(s) })) }))
    };
  }
}
</script>
</body>
</html>
